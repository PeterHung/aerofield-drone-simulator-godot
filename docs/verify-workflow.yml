name: Verify Godot project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download official Godot 4.7.2
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --quit
      - name: Training rules and physical flight integration
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --script tests/test_simulator.gd
      - name: Native input and UI integration
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --script tests/test_ui.gd
      - name: Check Python launch and export tools
        run: python3 -m py_compile tools/build.py tools/serve_web.py
